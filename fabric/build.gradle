plugins {
    id 'unimined-fabric'
}


// ==================== Dependencies ====================

def addMod(path, enabled) {
    if (enabled == "2")
        dependencies { modImplementation(path) }
    else if (enabled == "1")
        dependencies { compileOnly(path) }
}

dependencies {
    // Fabric loader
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Fabric API (bundled as jar-in-jar so users don't need to install it separately)
    modImplementation ("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}")
    include ("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") {
        // including the gametest API can cause issues for other mods if included in our jar
        exclude module: "fabric-gametest-api-v1"
    }

    // Mod Menu
    addMod("maven.modrinth:modmenu:${rootProject.modmenu_version}", rootProject.enable_mod_menu)

    // Starlight
    addMod("curse.maven:starlight-521783:${rootProject.starlight_version_fabric}", rootProject.enable_starlight)

    // Phosphor
    addMod("curse.maven:phosphor-372124:${rootProject.phosphor_version_fabric}", rootProject.enable_phosphor)

    // Sodium
    addMod("maven.modrinth:sodium:${rootProject.sodium_version}", rootProject.enable_sodium)
    if (rootProject.enable_sodium == "2") implementation "org.joml:joml:1.10.2"
    
	// Lithium
    addMod("maven.modrinth:lithium:${rootProject.lithium_version}", rootProject.enable_lithium)
    
    // Iris
    addMod("maven.modrinth:iris:${rootProject.iris_version}", rootProject.enable_iris)
    
    // BCLib
    addMod("com.github.quiqueck:BCLib:${rootProject.bclib_version}", rootProject.enable_bclib)
    
    // Canvas
    addMod("io.vram:canvas-fabric-${project.canvas_version}", rootProject.enable_canvas)
    
    // Chunky
    addMod("maven.modrinth:chunky:${project.chunky_version}", rootProject.enable_chunky)
}


// ==================== Tasks ====================

task deleteResources(type: Delete) {
    delete file("build/resources/main")
}

processResources {
    dependsOn(copyCoreResources)
    // dependsOn(copyCommonLoaderResources)
}

tasks.named('runClient') {
    dependsOn(copyCoreResources)
    // dependsOn(copyCommonLoaderResources)
    finalizedBy(deleteResources)
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

// Copies the built jar to the folder in "kabuModsDir" from the git ignored local.properties.
// Only for the MC version that folder is for, so other version builds can't end up in it.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def modsDirPath = project.findProperty("kabuModsDir") ?: localProperties.getProperty("kabuModsDir")
def modsDirMcVersion = project.findProperty("kabuModsDirMcVersion") ?: "1.20.4"
if (modsDirPath && rootProject.minecraft_version == modsDirMcVersion) {
    def copyToModsDir = tasks.register("copyToModsDir") {
        doLast {
            def modsDir = file(modsDirPath)
            def builtJar = file("build/libs/${rootProject.mod_name}-fabric-${rootProject.mod_version}-${rootProject.minecraft_version}.jar")
            def oldJars = modsDir.listFiles({ File f -> f.name.startsWith("${rootProject.mod_name}-fabric-") && f.name.endsWith(".jar") } as FileFilter) ?: []
            // two copies of the mod would stop the game from launching, so an old jar has to go first
            def lockedJars = oldJars.findAll { !it.delete() }
            if (lockedJars) {
                logger.warn("Not copied to [${modsDir}], can't replace ${lockedJars*.name}. Is the game running?")
                return
            }
            java.nio.file.Files.copy(builtJar.toPath(), new File(modsDir, builtJar.name).toPath())
            logger.lifecycle("Copied ${builtJar.name} to [${modsDir}]")
        }
    }
    tasks.named("assemble") { finalizedBy(copyToModsDir) }
}
